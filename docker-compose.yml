services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-cultural_events}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cultural_events}
      POSTGRES_DB: ${DB_NAME:-cultural_events}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cultural_events} -d ${DB_NAME:-cultural_events}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
