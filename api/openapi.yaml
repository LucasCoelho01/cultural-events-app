openapi: 3.1.0
info:
  title: Cultural Events API
  description: API do sistema de eventos culturais (shows, teatro, exposições).
  version: "0.1.0"
servers:
  - url: /api/v1
paths:
  /states:
    get:
      tags: [locations]
      operationId: listStates
      summary: Lista as unidades federativas
      description: Retorna todas as UFs, ordenadas por nome.
      responses:
        "200":
          description: Lista de UFs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/State"
  /cities:
    get:
      tags: [locations]
      operationId: listCities
      summary: Lista cidades de forma paginada
      description: Retorna cidades ordenadas por nome; por padrão apenas as ativas.
      parameters:
        - name: uf
          in: query
          required: false
          description: Sigla da UF (2 letras, sem diferenciar maiúsculas).
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
            example: SP
        - name: active
          in: query
          required: false
          description: Filtra por cidades ativas (padrão) ou inativas.
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          required: false
          description: Número da página (baseado em zero).
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Quantidade de itens por página.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de cidades.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /cities/default:
    get:
      tags: [locations]
      operationId: getDefaultCity
      summary: Retorna a cidade padrão
      description: Cidade identificada pela configuração `app.default-city` (formato `uf/slug`).
      responses:
        "200":
          description: Cidade padrão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "500":
          description: Configuração da cidade padrão inválida (malformada, inexistente ou inativa).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /cities/{uf}/{slug}:
    get:
      tags: [locations]
      operationId: getCity
      summary: Busca uma cidade por UF e slug
      parameters:
        - name: uf
          in: path
          required: true
          description: Sigla da UF (2 letras, sem diferenciar maiúsculas).
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
            example: SP
        - name: slug
          in: path
          required: true
          description: Identificador textual da cidade dentro da UF.
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Cidade encontrada (ativa ou não).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Cidade não encontrada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /cities/{uf}/{slug}/events/{eventSlug}:
    parameters:
      - name: uf
        in: path
        required: true
        description: Sigla da UF (2 letras, sem diferenciar maiúsculas).
        schema:
          type: string
          pattern: "^[A-Za-z]{2}$"
          example: SP
      - name: slug
        in: path
        required: true
        description: Identificador textual da cidade dentro da UF.
        schema:
          type: string
          maxLength: 120
      - name: eventSlug
        in: path
        required: true
        description: Identificador textual do evento dentro da cidade.
        schema:
          type: string
          maxLength: 200
    get:
      tags: [events]
      operationId: getPublishedEvent
      summary: Busca um evento publicado por cidade e slug
      description: >-
        Endpoint público de detalhe. Retorna o evento somente se estiver `PUBLISHED` na cidade informada;
        eventos em outro status, de outra cidade ou inexistentes respondem 404 sem distinção.
      responses:
        "200":
          description: Evento publicado encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/EventNotFound"
  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Lista a árvore de categorias
      description: >-
        Retorna as categorias raiz, cada uma com suas subcategorias em `children`, ordenadas por
        `sortOrder` e, em empate, por nome.
      responses:
        "200":
          description: Árvore de categorias.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /categories/{slug}:
    get:
      tags: [categories]
      operationId: getCategory
      summary: Busca uma categoria por slug
      description: Retorna a categoria (raiz ou subcategoria) com suas subcategorias em `children`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Identificador textual da categoria.
          schema:
            type: string
            maxLength: 80
            example: shows
      responses:
        "200":
          description: Categoria encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Categoria não encontrada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /venues:
    get:
      tags: [venues]
      operationId: listVenues
      summary: Lista locais de uma cidade de forma paginada
      description: >-
        Retorna os locais da cidade informada em `city` (padrão: `app.default-city`), ordenados por nome.
      parameters:
        - name: city
          in: query
          required: false
          description: Cidade no formato `uf/slug`; padrão é a cidade configurada em `app.default-city`.
          schema:
            type: string
            pattern: "^[A-Za-z]{2}/[^/\\s]+$"
            example: sp/sao-paulo
        - name: neighborhood
          in: query
          required: false
          description: Filtra pelo bairro (igualdade sem diferenciar maiúsculas).
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          required: false
          description: Número da página (baseado em zero).
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Quantidade de itens por página.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de locais.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Cidade do filtro não encontrada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [venues]
      operationId: createVenue
      summary: Cadastra um local
      description: Cria o local; `slug` ausente é gerado a partir de `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueInput"
      responses:
        "201":
          description: Local criado.
          headers:
            Location:
              description: URL do local criado.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /venues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador público (UUID) do local.
        schema:
          type: string
          format: uuid
    get:
      tags: [venues]
      operationId: getVenue
      summary: Busca um local por id
      responses:
        "200":
          description: Local encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/VenueNotFound"
    put:
      tags: [venues]
      operationId: replaceVenue
      summary: Substitui todos os campos de um local
      description: Campos opcionais ausentes passam a nulos; `slug` ausente é regenerado a partir de `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueInput"
      responses:
        "200":
          description: Local atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [venues]
      operationId: deleteVenue
      summary: Remove um local
      responses:
        "204":
          description: Local removido.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Lista eventos de uma cidade de forma paginada
      description: >-
        Retorna os eventos da cidade informada em `city` (padrão `app.default-city`), ordenados pela próxima
        sessão a partir do maior entre agora e `from`; eventos sem sessão futura vêm depois.
      parameters:
        - name: city
          in: query
          required: false
          description: Cidade no formato `uf/slug`; padrão é a cidade configurada em `app.default-city`.
          schema:
            type: string
            pattern: "^[A-Za-z]{2}/[^/\\s]+$"
            example: sp/sao-paulo
        - name: category
          in: query
          required: false
          description: Slug da categoria; inclui eventos das suas subcategorias.
          schema:
            type: string
            maxLength: 80
            example: shows
        - name: from
          in: query
          required: false
          description: Início do intervalo de sessões (inclusive), ISO 8601 com fuso.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Fim do intervalo de sessões (inclusive), ISO 8601 com fuso.
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          description: Filtra pelo status do evento; sem o parâmetro, todos.
          schema:
            $ref: "#/components/schemas/EventStatus"
        - name: page
          in: query
          required: false
          description: Número da página (baseado em zero).
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Quantidade de itens por página.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de eventos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Cidade ou categoria do filtro não encontrada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [events]
      operationId: createEvent
      summary: Cadastra um evento com suas sessões
      description: Cria o evento; `slug` ausente é gerado a partir de `title` e `status` ausente é `DRAFT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Evento criado.
          headers:
            Location:
              description: URL do evento criado.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador público (UUID) do evento.
        schema:
          type: string
          format: uuid
    get:
      tags: [events]
      operationId: getEvent
      summary: Busca um evento por id
      responses:
        "200":
          description: Evento encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/EventNotFound"
    put:
      tags: [events]
      operationId: replaceEvent
      summary: Substitui todos os campos e sessões de um evento
      description: >-
        Substituição completa com lock otimista: `version` deve ser a atual (senão 409) e `status` é obrigatório.
        Campos opcionais ausentes passam a nulos e sessões ausentes são removidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdateInput"
      responses:
        "200":
          description: Evento atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [events]
      operationId: deleteEvent
      summary: Remove um evento e suas sessões
      responses:
        "204":
          description: Evento removido.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/EventNotFound"
components:
  responses:
    BadRequest:
      description: Parâmetro inválido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito com o estado atual (por exemplo, slug já existe na cidade).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Corpo inválido; `errors` lista os campos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    VenueNotFound:
      description: Local não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    EventNotFound:
      description: Evento não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: >-
        Resposta de erro padronizada no formato RFC 7807 (application/problem+json).
      properties:
        type:
          type: string
          format: uri
          description: Identificador do tipo de problema.
          example: about:blank
        title:
          type: string
          description: Resumo curto e legível do tipo de problema.
          example: Unprocessable Entity
        status:
          type: integer
          format: int32
          description: Código de status HTTP gerado pelo servidor de origem.
          example: 422
        detail:
          type: string
          description: Explicação legível específica desta ocorrência do problema.
          example: A requisição contém campos inválidos.
        instance:
          type: string
          format: uri
          description: Identificador da ocorrência específica do problema.
        errors:
          type: array
          description: Lista de erros por campo, presente quando status é 422.
          items:
            $ref: "#/components/schemas/FieldError"
      required:
        - title
        - status
    FieldError:
      type: object
      description: Erro de validação associado a um campo específico da requisição.
      properties:
        field:
          type: string
          description: Nome do campo que falhou na validação.
          example: nome
        message:
          type: string
          description: Mensagem explicando a violação de validação.
          example: não pode estar em branco
      required:
        - field
        - message
    PageMetadata:
      type: object
      description: Metadados de paginação retornados em respostas de listagem.
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          description: Número da página atual (baseado em zero).
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Quantidade máxima de itens por página.
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Quantidade total de itens disponíveis.
          example: 123
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Quantidade total de páginas disponíveis.
          example: 7
      required:
        - page
        - size
        - totalElements
        - totalPages
    State:
      type: object
      description: Unidade federativa do Brasil.
      properties:
        uf:
          type: string
          minLength: 2
          maxLength: 2
          description: Sigla da UF.
          example: SP
        name:
          type: string
          description: Nome da UF.
          example: São Paulo
      required:
        - uf
        - name
    City:
      type: object
      description: Cidade cadastrada no catálogo de localidades.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        ibgeCode:
          type: integer
          format: int32
          description: Código IBGE do município.
          example: 3550308
        uf:
          type: string
          minLength: 2
          maxLength: 2
          example: SP
        name:
          type: string
          example: São Paulo
        slug:
          type: string
          example: sao-paulo
        timezone:
          type: string
          description: Fuso horário IANA.
          example: America/Sao_Paulo
        latitude:
          type: number
          nullable: true
          description: Latitude em graus decimais, se cadastrada.
          example: -23.55052
        longitude:
          type: number
          nullable: true
          description: Longitude em graus decimais, se cadastrada.
          example: -46.633308
        active:
          type: boolean
          description: Indica se a cidade está habilitada no sistema.
      required:
        - id
        - ibgeCode
        - uf
        - name
        - slug
        - timezone
        - active
    CityPage:
      type: object
      description: Página de cidades.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/City"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
        - items
        - page
    Category:
      type: object
      description: Categoria ou subcategoria de eventos (no máximo 2 níveis).
      properties:
        id:
          type: integer
          format: int64
          description: Identificador interno da categoria.
          example: 1
        name:
          type: string
          description: Nome da categoria.
          example: Shows
        slug:
          type: string
          description: Identificador textual único da categoria.
          example: shows
        sortOrder:
          type: integer
          format: int32
          description: Posição de exibição entre categorias irmãs.
          example: 10
        parentSlug:
          type: string
          nullable: true
          description: Slug da categoria pai; nulo nas categorias raiz.
          example: shows
        children:
          type: array
          description: Subcategorias, ordenadas; vazio em subcategorias e em raízes sem filhas.
          items:
            $ref: "#/components/schemas/Category"
      required:
        - id
        - name
        - slug
        - sortOrder
        - children
    VenueInput:
      type: object
      description: Corpo de criação e de substituição de um local.
      properties:
        cityId:
          type: integer
          format: int64
          description: Id da cidade (de `GET /cities`); deve existir e estar ativa.
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^.*\\S.*$"
          example: Sala São Paulo
        slug:
          type: string
          nullable: true
          maxLength: 200
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: Identificador textual único na cidade; se ausente, é gerado a partir de `name`.
          example: sala-sao-paulo
        addressLine:
          type: string
          nullable: true
          maxLength: 255
          example: Praça Júlio Prestes, 16
        neighborhood:
          type: string
          nullable: true
          maxLength: 120
          example: Campos Elíseos
        postalCode:
          type: string
          nullable: true
          pattern: "^\\d{5}-\\d{3}$"
          example: 01218-020
        latitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
          example: -23.5343
        longitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
          example: -46.6395
        websiteUrl:
          type: string
          nullable: true
          maxLength: 2048
          pattern: "^https?://\\S+$"
          example: https://www.salasaopaulo.art.br
      required:
        - cityId
        - name
    Venue:
      type: object
      description: Local (casa de show, teatro, museu) de uma cidade.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador público do local.
        cityId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Sala São Paulo
        slug:
          type: string
          description: Identificador textual único na cidade.
          example: sala-sao-paulo
        addressLine:
          type: string
          nullable: true
        neighborhood:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - cityId
        - name
        - slug
        - createdAt
        - updatedAt
    VenuePage:
      type: object
      description: Página de locais.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
        - items
        - page
    EventStatus:
      type: string
      description: Situação do evento.
      enum: [DRAFT, PUBLISHED, CANCELLED, ARCHIVED]
    OccurrenceStatus:
      type: string
      description: Situação da sessão.
      enum: [SCHEDULED, CANCELLED, SOLD_OUT]
    OccurrenceInput:
      type: object
      description: Sessão (data e hora) de um evento.
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: "#/components/schemas/OccurrenceStatus"
          default: SCHEDULED
      required:
        - startsAt
    Occurrence:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: "#/components/schemas/OccurrenceStatus"
      required:
        - startsAt
        - status
    CategoryRef:
      type: object
      properties:
        id:
